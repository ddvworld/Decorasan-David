name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نمایش محتوای AndroidManifest.xml (برای اطمینان)
        run: cat android/app/src/main/AndroidManifest.xml

      - name: نصب Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: "17"

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: دریافت وابستگی‌های پروژه
        run: flutter pub get

      - name: ساخت فایل APK نهایی
        run: flutter build apk --release

      - name: آپلود فایل APK ساخته شده
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
