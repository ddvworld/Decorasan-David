name: cabinet_app_new
description: مدیریت طراحی کمد - نسخه آفلاین
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ===== دیتابیس محلی =====
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.0
  path_provider: ^2.0.15
  
  # ===== مدیریت حالت =====
  provider: ^6.0.5
  
  # ===== ابزارها =====
  image_picker: ^1.0.4
  pdf: ^3.10.8
  printing: ^5.11.1
  url_launcher: ^6.2.5
  share_plus: ^7.2.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/logo.png
    - assets/images/background.jpg
    - assets/images/cabinet_1.png
    - assets/images/cabinet_2.png
    - assets/images/cabinet_3.png
    - assets/images/cabinet_4.png
    - assets/images/cabinet_5.png
    - assets/images/cabinet_6.png
    - assets/images/cabinet_7.png
    - assets/images/cabinet_8.png

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    icon_background_color: "#FFFFFF"
  macos:
    generate: true
  image_path: "assets/images/logo.png"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  min_sdk_android: 21